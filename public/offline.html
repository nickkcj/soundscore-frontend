<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>You're offline — SoundScore</title>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #faf7f7;
      color: #1c1c1e;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 360px; }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      margin: 0 auto 20px;
      display: block;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #6b6b70; line-height: 1.5; margin: 0 0 24px; }
    button {
      background: #722F37;
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/icons/icon-192.png" alt="SoundScore" />
    <h1>You're offline</h1>
    <p>SoundScore needs an internet connection. Check your network and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
